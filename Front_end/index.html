<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minhas Tarefas</title>
</head>
<body>
    <h1>Gerenciador de Tarefas</h1>
    
    <input type="text" id="inputTarefa" placeholder="Digite uma nova tarefa...">
    <button onclick="adicionarTarefa()">Adicionar Task</button>

    <hr>
    <h3>Minhas Tasks:</h3>
    <ul id="listaTarefas"></ul>

    <script>
        const API_URL = "http://127.0.0.1:8000";

        async function listarTarefas() {
            try {
                const response = await fetch(API_URL + "/tasks");
                const tarefas = await response.json();
                const lista = document.getElementById("listaTarefas");
                lista.innerHTML = ""; 

                tarefas.forEach(t => {
                    lista.innerHTML += `
                        <li>
                            <strong>${t.titulo}</strong> 
                            <button onclick="prepararEdicao(${t.id}, '${t.titulo}')">Editar</button>
                            <button onclick="deletarTarefa(${t.id})">Excluir</button>
                        </li>`;
                });
            } catch (error) {
                console.error("Erro ao carregar tarefas:", error);
            }
        }

        async function adicionarTarefa() {
            const input = document.getElementById("inputTarefa");
            const titulo = input.value;
            if (!titulo) return;

            await fetch(API_URL + "/tasks?titulo=" + encodeURIComponent(titulo), { method: "POST" });
            input.value = "";
            listarTarefas();
        }

        async function prepararEdicao(id, tituloAtual) {
            const novoTitulo = prompt("Edite o nome da tarefa:", tituloAtual);
            if (novoTitulo && novoTitulo !== tituloAtual) {
                await editarTarefa(id, novoTitulo);
            }
        }

        async function editarTarefa(id, novoTitulo) {
            await fetch(API_URL + "/tasks/" + id + "?novo_titulo=" + encodeURIComponent(novoTitulo), { 
                method: "PUT" 
            });
            listarTarefas();
        }

        async function deletarTarefa(id) {
            await fetch(API_URL + "/tasks/" + id, { method: "DELETE" });
            listarTarefas();
        }

        listarTarefas();
    </script>
</body>
</html>
